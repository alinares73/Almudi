<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d2914">
<title>Sagrada Escritura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf7f2;
  --card: #fff;
  --ink: #2c2416;
  --muted: #7a6e5d;
  --accent: #8b4513;
  --accent-soft: #c4a574;
  --header: #3d2914;
  --link: #6b3a1f;
  --border: #e8e0d4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1612;
    --card: #242018;
    --ink: #f0e8dc;
    --muted: #a89880;
    --accent: #d4a574;
    --header: #2a2118;
    --link: #e0b888;
    --border: #3a3228;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: "Source Sans 3", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
header {
  background: var(--header); color: #f5efe6;
  padding: 0 12px; height: 56px;
  display: flex; align-items: center; gap: 8px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 4px #0003;
}
header button {
  background: none; border: none; color: inherit;
  font-size: 1.1rem; padding: 8px 10px; cursor: pointer;
  border-radius: 6px;
}
header button:active { background: #ffffff18; }
header h1 {
  margin: 0; flex: 1; font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 1.35rem; font-weight: 600; letter-spacing: .02em;
}
header h1 a { color: inherit; text-decoration: none; }
#content {
  flex: 1; overflow-y: auto; padding: 16px 16px 48px;
  max-width: 720px; margin: 0 auto; width: 100%;
}
#content h1, #content .doctitle {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 1.8rem; margin: 0 0 1rem; font-weight: 600;
}
#content p { margin: .4rem 0; line-height: 1.65; font-size: 1.05rem; }
#content a { color: var(--link); }
#content a.entre { border-bottom: 1px dotted currentColor; text-decoration: none; }
#content .blank { display: none; }
#content span[style*="color:#c0c0c0"],
#content span[style*="color:#cccc99"],
#content span[style*="color:#ffffe6"] { color: inherit !important; }

/* Portada */
.portada { padding: 8px 0 24px; }
.portada h2 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 1.6rem; text-align: center; margin: 0 0 4px; font-weight: 600;
}
.portada .sub { text-align: center; color: var(--muted); font-size: .95rem; margin-bottom: 20px; }
.seccion { margin: 18px 0 8px; font-size: .75rem; text-transform: uppercase;
  letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}
.grid a {
  display: block; background: var(--card); color: var(--ink);
  text-decoration: none; padding: 12px 10px; border-radius: 8px;
  text-align: center; font-size: .95rem; font-weight: 500;
  border: 1px solid var(--border); transition: transform .1s, box-shadow .1s;
}
.grid a:active { transform: scale(.98); }
.grid a:hover { box-shadow: 0 2px 8px #0002; }
.loading { text-align: center; padding: 3rem; color: var(--muted); }
</style>
</head>
<body>
<header>
  <button id="backBtn" title="Atrás">←</button>
  <h1><a href="#" id="homeLink">Sagrada Escritura</a></h1>
  <button id="homeBtn" title="Inicio">⌂</button>
</header>
<main id="content"></main>

<script>
const LIBROS = [
  {s:"Pentateuco", items:[
    ["Génesis","o305"],["Éxodo","o418"],["Levítico","o504"],["Números","o567"],["Deuteronomio","o647"]
  ]},
  {s:"Históricos", items:[
    ["Josué","o728"],["Jueces","o782"],["Rut","o831"],["1 Samuel","o844"],["2 Samuel","o915"],
    ["1 Reyes","o973"],["2 Reyes","o1025"],["1 Crónicas","o1084"],["2 Crónicas","o1153"],
    ["Esdras","o1237"],["Nehemías","o1264"],["Tobías","o1299"],["Judit","o1334"],["Ester","o1372"],
    ["1 Macabeos","o1398"],["2 Macabeos","o1441"]
  ]},
  {s:"Sapienciales", items:[
    ["Job","o1483"],["Salmos","o1571"],["Proverbios","o1945"],["Eclesiastés","o2018"],
    ["Cantar","o1882"],["Sabiduría","o2064"],["Eclesiástico","o2112"]
  ]},
  {s:"Proféticos", items:[
    ["Isaías","o2243"],["Jeremías","o2387"],["Lamentaciones","o1921"],["Baruc","o2505"],
    ["Ezequiel","o2523"],["Daniel","o2633"],["Oseas","o2668"],["Joel","o2702"],["Amós","o2715"],
    ["Abdías","o2738"],["Jonás","o2747"],["Miqueas","o2761"],["Nahúm","o2783"],["Habacuc","o2795"],
    ["Sofonías","o2809"],["Ageo","o2824"],["Zacarías","o2833"],["Malaquías","o2870"]
  ]},
  {s:"Evangelios y Hechos", items:[
    ["Mateo","o2886"],["Marcos","o2948"],["Lucas","o2987"],["Juan","o3041"],["Hechos","o3088"]
  ]},
  {s:"Cartas", items:[
    ["Romanos","o3168"],["1 Corintios","o3208"],["2 Corintios","o3252"],["Gálatas","o3291"],
    ["Efesios","o3311"],["Filipenses","o3331"],["Colosenses","o3350"],["1 Tesalonicenses","o3369"],
    ["2 Tesalonicenses","o3396"],["1 Timoteo","o3420"],["2 Timoteo","o3442"],["Tito","o3461"],
    ["Filemón","o3472"],["Hebreos","o3482"],["Santiago","o3516"],["1 Pedro","o3535"],
    ["2 Pedro","o3553"],["1 Juan","o3568"],["2 Juan","o3585"],["3 Juan","o3597"],["Judas","o3608"]
  ]},
  {s:"Apocalipsis", items:[["Apocalipsis","o3616"]]}
];

let INDEX = null;
let history = [];
const content = document.getElementById('content');

async function init() {
  INDEX = await (await fetch('index.json')).json();
  showPortada();
}

function showPortada() {
  history = [];
  let html = `<div class="portada">
    <h2>Sagrada Escritura</h2>
    <p class="sub">Elige un libro</p>`;
  for (const sec of LIBROS) {
    html += `<div class="seccion">${sec.s}</div><div class="grid">`;
    for (const [name, aid] of sec.items) {
      html += `<a href="#" data-book="Biblia" data-anchor="${aid}">${name}</a>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  content.innerHTML = html;
  content.querySelectorAll('a[data-book]').forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      go(a.dataset.book, a.dataset.anchor);
    };
  });
  content.scrollTop = 0;
}

async function go(book, anchor, push = true) {
  if (!INDEX || !INDEX[book]) return;
  if (push) history.push({book, anchor});
  content.innerHTML = '<p class="loading">Cargando…</p>';
  const chunks = INDEX[book].chunks;
  let target = chunks[0];
  if (anchor) {
    const num = parseInt(anchor.replace(/^o/,''), 10);
    for (const c of chunks) {
      if (c.anchors && c.anchors.includes(num)) { target = c; break; }
    }
  }
  const html = await (await fetch('chunks/' + target.file)).text();
  content.innerHTML = html;
  bindLinks();
  if (anchor) {
    requestAnimationFrame(() => {
      const el = document.getElementById(anchor);
      if (el) el.scrollIntoView({block:'start'});
    });
  } else content.scrollTop = 0;
}

function bindLinks() {
  content.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || href.startsWith('http')) return;
    a.onclick = e => {
      e.preventDefault();
      const m = href.match(/^([^#]*)(?:#(o\d+))?$/);
      if (!m) return;
      let book = m[1].replace(/\.html$/,'');
      const anchor = m[2] || null;
      if (!book) {
        // same book
        const last = history[history.length-1];
        book = last ? last.book : 'Biblia';
      }
      if (INDEX[book]) go(book, anchor);
    };
  });
}

document.getElementById('homeLink').onclick = e => { e.preventDefault(); showPortada(); };
document.getElementById('homeBtn').onclick = showPortada;
document.getElementById('backBtn').onclick = () => {
  if (history.length > 1) {
    history.pop();
    const prev = history[history.length-1];
    go(prev.book, prev.anchor, false);
  } else {
    showPortada();
  }
};

init();
</script>
</body>
</html>
